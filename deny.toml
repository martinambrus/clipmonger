# cargo-deny config (seg-11 §5 gate 6, R-F3): advisories + licenses +
# bans + sources in one tool. First run is calibration (rel.md Q5).

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained (transitive build dep); no vulnerability, triage at next dep bump" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; transitive via ksni 0.3.7 (Linux tray) and ashpd 0.13.13 (Wayland portal) on zbus 5; merged into zbus 6.0.0; no ksni or ashpd release on zbus 6 as of 2026-10-31; Unix-only; revisit when they move to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; transitive via ksni 0.3.7 (Linux tray) and ashpd 0.13.13 (Wayland portal) on zbus 5; merged into zbus 6.0.0; no ksni or ashpd release on zbus 6 as of 2026-10-31; Unix-only; revisit when they move to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; transitive via ksni 0.3.7 (Linux tray) and ashpd 0.13.13 (Wayland portal) on zbus 5; merged into zbus 6.0.0; no ksni or ashpd release on zbus 6 as of 2026-10-31; Unix-only; revisit when they move to zbus 6" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
]
unused-allowed-license = "deny"
confidence-threshold = 0.8

# egui bundles these fonts, including Ubuntu-Light as the primary UI font.
# Their license texts are retained in licenses/fonts/ for release shipping.
# Pinned to the version whose notices are in licenses/fonts/; re-check them when egui updates it.
[[licenses.exceptions]]
crate = "epaint_default_fonts@0.37.0"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
