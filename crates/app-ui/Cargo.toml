[package]
name = "clipmonger-app-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish.workspace = true

[lib]
name = "clipmonger_app_ui"

[[bin]]
name = "clipmonger"
path = "src/main.rs"
required-features = ["gui"]

[[example]]
name = "runner_smoke"
required-features = ["gui"]

[dependencies]
clipmonger-core = { path = "../core" }
clipmonger-platform = { path = "../platform" }
clipmonger-ipc = { path = "../ipc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
uuid = { version = "1.28", features = ["v7", "serde"] }
egui = { version = "0.37", optional = true, features = ["default_fonts"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["x11", "wayland", "rwh_06"] }
egui-winit = { version = "0.37", optional = true, default-features = false, features = ["x11", "wayland", "clipboard"] }
softbuffer = { version = "0.4.8", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
hdrshot-egui-backend = { version = "=0.2.0", optional = true }
egui_system_font_provider = { version = "0.37", optional = true }
bytemuck = { version = "1.25", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
tiny-skia = { version = "0.12", optional = true }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["gui"]
gui = ["dep:egui", "dep:winit", "dep:egui-winit", "dep:softbuffer", "dep:hdrshot-egui-backend", "dep:egui_system_font_provider", "dep:bytemuck"]
software = ["dep:softbuffer", "dep:tiny-skia", "dep:winit", "dep:egui-winit", "gui", "windows/Win32_Graphics_Gdi", "windows/Win32_System_LibraryLoader", "windows/Win32_UI_Input_KeyboardAndMouse", "windows/Win32_System_SystemServices", "windows/Win32_UI_Controls", "windows/Win32_System_Threading", "windows/Win32_UI_Shell"]

[dev-dependencies]
# Live push-listener tests run a real IPC server.
clipmonger-ipc = { path = "../ipc", features = ["server"] }
tokio.workspace = true

[lints]
workspace = true
