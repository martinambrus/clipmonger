[package]
name = "clipmonger-app-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[lib]
name = "clipmonger_app_ui"

[[bin]]
name = "clipmonger"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
clipmonger-core = { path = "../core" }
clipmonger-platform = { path = "../platform" }
clipmonger-ipc = { path = "../ipc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
uuid = { version = "1.28", features = ["v7", "serde"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "system_fonts"] }
egui = { version = "0.37", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
softbuffer = { version = "0.4.6", optional = true }
tiny-skia = { version = "0.12", optional = true }
winit = { version = "0.30", optional = true }
egui-winit = { version = "0.37", optional = true }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_System_Threading", "Win32_UI_Shell"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]
software = ["dep:softbuffer", "dep:tiny-skia", "dep:winit", "dep:egui-winit", "dep:windows", "gui"]


[lints]
workspace = true
