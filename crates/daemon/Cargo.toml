[package]
name = "clipmonger-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "clipmonger-daemon"
path = "src/main.rs"

[features]
default = []
backend-windows = ["dep:clipmonger-backend-windows"]
backend-x11 = []
backend-wayland = []
backend-macos = []
minimal = []

[dependencies]
clipmonger-core = { path = "../core" }
clipmonger-platform = { path = "../platform" }
clipmonger-ipc = { path = "../ipc", features = ["server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
clipmonger-backend-windows = { path = "../backend-windows", optional = true }

[lints]
workspace = true
