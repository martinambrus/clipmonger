[package]
name = "clipmonger-daemon"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clipmonger-daemon"
path = "src/main.rs"

[features]
# Backends are on by default: a default build must never ship the
# skeleton daemon (T-409 finding). Deps are target-gated, so enabling
# all three is a no-op on non-matching targets. Use
# `--no-default-features` (optionally `--features minimal`) for the
# headless skeleton.
default = ["backend-windows", "backend-x11", "backend-wayland"]
backend-windows = ["dep:clipmonger-backend-windows"]
backend-x11 = ["dep:clipmonger-backend-x11"]
backend-wayland = ["dep:clipmonger-backend-wayland", "dep:ashpd", "dep:futures-util"]
backend-macos = []
minimal = []

[dependencies]
clipmonger-backend-windows = { path = "../backend-windows", optional = true }
clipmonger-core = { path = "../core" }
clipmonger-platform = { path = "../platform" }
clipmonger-ipc = { path = "../ipc", features = ["server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Storage_FileSystem","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_System_LibraryLoader","Win32_System_Threading"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
clipmonger-backend-x11 = { path = "../backend-x11", optional = true }
clipmonger-backend-wayland = { path = "../backend-wayland", optional = true }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"], optional = true }
futures-util = { version = "0.3", optional = true }

[lints]
workspace = true
